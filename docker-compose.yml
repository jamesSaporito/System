name: portfolio

x-dev: &dev
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
  volumes:
    - .:/app
    # Container-only installs so Linux binaries never collide with the host's.
    - node_modules:/app/node_modules
    - public_node_modules:/app/apps/public/node_modules
    - public_next:/app/apps/public/.next
    - backend_node_modules:/app/apps/backend/node_modules
    - ui_node_modules:/app/packages/ui/node_modules
    - config_node_modules:/app/packages/config/node_modules
    - contracts_node_modules:/app/packages/contracts/node_modules
    - db_node_modules:/app/packages/db/node_modules
    - pnpm_store:/home/node/.local/share/pnpm

services:
  # Installs once so the app services never run `pnpm install` concurrently on shared volumes.
  install:
    <<: *dev
    command: pnpm install --frozen-lockfile

  public:
    <<: *dev
    command: pnpm turbo run dev --filter=@portfolio/public
    ports:
      - "3000:3000"
    depends_on:
      install:
        condition: service_completed_successfully

  backend:
    <<: *dev
    command: sh -c "pnpm --filter=@portfolio/db db:deploy && pnpm turbo run dev --filter=@portfolio/backend"
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio
    depends_on:
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_started

  postgres:
    image: postgres:18.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portfolio"]
      interval: 2s
      timeout: 5s
      retries: 15

  # S3 stand-in for media uploads. Root so it can write to the named volume.
  s3mock:
    image: adobe/s3mock:5.2.3
    user: "0:0"
    ports:
      - "9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: media
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3mock_data:/data

  preview:
    profiles: [preview]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: preview
    ports:
      - "8080:8080"

volumes:
  node_modules:
  public_node_modules:
  public_next:
  backend_node_modules:
  ui_node_modules:
  config_node_modules:
  contracts_node_modules:
  db_node_modules:
  pnpm_store:
  pg_data:
  s3mock_data:
