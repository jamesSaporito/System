name: portfolio

x-dev: &dev
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
  volumes:
    - .:/app
    # Container-only installs so Linux binaries never collide with the host's.
    - node_modules:/app/node_modules
    - portfolio_node_modules:/app/apps/portfolio/node_modules
    - portfolio_next:/app/apps/portfolio/.next
    - admin_node_modules:/app/apps/admin/node_modules
    - admin_next:/app/apps/admin/.next
    - backend_node_modules:/app/apps/backend/node_modules
    - security_brief_node_modules:/app/packages/security-brief/node_modules
    - access_node_modules:/app/packages/access/node_modules
    - ai_node_modules:/app/packages/ai/node_modules
    - ui_node_modules:/app/packages/ui/node_modules
    - config_node_modules:/app/packages/config/node_modules
    - db_node_modules:/app/packages/db/node_modules
    - media_node_modules:/app/packages/media/node_modules
    - pnpm_store:/home/node/.local/share/pnpm

services:
  # Installs once so the app services never run `pnpm install` concurrently on shared volumes.
  install:
    <<: *dev
    command: pnpm install --frozen-lockfile

  # The portfolio site (apps/portfolio).
  portfolio:
    <<: *dev
    working_dir: /app/apps/portfolio
    command: pnpm turbo run dev
    ports:
      - "3000:3000"
    depends_on:
      install:
        condition: service_completed_successfully
      s3:
        condition: service_started

  admin:
    <<: *dev
    working_dir: /app/apps/admin
    command: pnpm turbo run dev
    ports:
      - "3001:3001"
    depends_on:
      install:
        condition: service_completed_successfully

  backend:
    <<: *dev
    # Turbo applies migrations first (backend dev depends on @portfolio/db's db:deploy).
    working_dir: /app/apps/backend
    command: pnpm turbo run dev
    ports:
      - "4000:4000"
    # Other settings come from the bind-mounted .env; this overrides its localhost URL.
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio
    depends_on:
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

  postgres:
    image: postgres:18.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portfolio"]
      interval: 2s
      timeout: 5s
      retries: 15

  # S3 stand-in for the portfolio bucket, photos under media/ (see packages/media).
  s3:
    image: chrislusf/seaweedfs:4.51
    # `weed mini` runs the whole SeaweedFS stack in one process; with no credentials configured, S3 access is open.
    command: ["mini", "-dir=/data", "-bucket=portfolio", "-s3.port=9090", "-master.telemetry=false"]
    ports:
      - "9090:9090"
    volumes:
      - s3_data:/data
    # Ready once the bucket exists (it's created a few seconds after boot), so `up --wait` really waits.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/portfolio"]
      interval: 2s
      timeout: 5s
      retries: 30

  preview:
    profiles: [preview]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: preview
    ports:
      - "8080:8080"
    depends_on:
      - s3

volumes:
  node_modules:
  portfolio_node_modules:
  portfolio_next:
  admin_node_modules:
  admin_next:
  backend_node_modules:
  security_brief_node_modules:
  access_node_modules:
  ai_node_modules:
  ui_node_modules:
  config_node_modules:
  db_node_modules:
  media_node_modules:
  pnpm_store:
  pg_data:
  s3_data:
