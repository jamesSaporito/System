name: portfolio

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Container-only installs so Linux binaries never collide with the host's.
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next
      - ui_node_modules:/app/packages/ui/node_modules
      - config_node_modules:/app/packages/config/node_modules
      - pnpm_store:/home/node/.local/share/pnpm

  preview:
    profiles: [preview]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: preview
    ports:
      - "8080:8080"

volumes:
  node_modules:
  web_node_modules:
  web_next:
  ui_node_modules:
  config_node_modules:
  pnpm_store:
