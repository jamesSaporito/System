# Mimics the planned CloudFront setup: clean URLs resolve to index.html
# (no redirects) and unknown paths return /404.html with a 404 status.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/index.html =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
